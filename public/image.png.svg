<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#08202d" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#041019" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#03070d" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#00c896" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="35%" stop-color="#00b4d8"/>
      <stop offset="70%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="g-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80ffea"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="heavy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg-glow)"/>
  <rect width="1600" height="900" fill="url(#core-glow)"/>

  <!-- Ambient decorative borders -->
  <rect x="80" y="80" width="240" height="140" rx="24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.2" />
  <rect x="1280" y="680" width="240" height="140" rx="24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.2" />
  <rect x="1320" y="100" width="40" height="40" rx="8" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3" />
  <rect x="1380" y="130" width="50" height="50" rx="8" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.2" />
  <rect x="120" y="720" width="36" height="36" rx="6" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.25" />
  <rect x="160" y="760" width="44" height="44" rx="8" fill="#00f0ff" fill-opacity="0.06" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.18" />

  <g transform="translate(800, 360)">
    <!-- Outer Glow behind ring -->
    <circle cx="0" cy="0" r="175" fill="none" stroke="#00f0ff" stroke-width="32" opacity="0.25" filter="url(#heavy-glow)"/>
    
    <!-- Trailing Pixel Blocks on the left -->
    <g fill="#00f0ff" filter="url(#glow)">
      <rect x="-290" y="-32" width="24" height="24" rx="4" opacity="0.9"/>
      <rect x="-260" y="-32" width="24" height="24" rx="4" opacity="0.95"/>
      <rect x="-230" y="-32" width="24" height="24" rx="4" opacity="1"/>

      <rect x="-290" y="-64" width="24" height="24" rx="4" opacity="0.6"/>
      <rect x="-260" y="-64" width="24" height="24" rx="4" opacity="0.8"/>
      <rect x="-230" y="-64" width="24" height="24" rx="4" opacity="0.9"/>

      <rect x="-290" y="0" width="24" height="24" rx="4" opacity="0.8"/>
      <rect x="-260" y="0" width="24" height="24" rx="4" opacity="0.95"/>

      <rect x="-290" y="32" width="24" height="24" rx="4" opacity="0.5"/>
      <rect x="-260" y="32" width="24" height="24" rx="4" opacity="0.75"/>

      <rect x="-320" y="-32" width="20" height="20" rx="4" opacity="0.7"/>
      <rect x="-320" y="0" width="20" height="20" rx="4" opacity="0.5"/>
      <rect x="-350" y="-16" width="18" height="18" rx="3" opacity="0.6"/>
    </g>

    <!-- Main Outer Ring -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="url(#ring-grad)" stroke-width="22" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="120 40 80 50" opacity="0.6"/>

    <!-- Inner G emblem with Left Arrow -->
    <g filter="url(#glow)">
      <!-- G outer loop -->
      <path d="M 40 -85 C -65 -85 -105 -25 -105 15 C -105 75 -50 115 35 115 C 80 115 105 85 105 40 L 105 10 L -25 10" 
            fill="none" stroke="url(#g-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Arrow head on inner crossbar pointing left -->
      <path d="M 0 -15 L -35 10 L 0 35" 
            fill="none" stroke="#80ffea" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
            
      <!-- Accent notch on top right of G -->
      <path d="M 40 -85 L 65 -85 L 65 -50" 
            fill="none" stroke="url(#g-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- RunGit Wordmark Typography -->
  <g text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="140" letter-spacing="-2">
    <text x="680" y="730" fill="#ffffff" filter="url(#glow)">Run</text>
    <text x="920" y="730" fill="#00e5ff" filter="url(#heavy-glow)">Git</text>
  </g>
</svg>